<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0a;
    --card: #121212;
    --card-2: #161616;
    --line: rgba(255,255,255,0.08);
    --gold: #FFD700;
    --gold-dim: #f0d060;
    --text: #ffffff;
    --muted: rgba(255,255,255,0.4);
    --muted-2: rgba(255,255,255,0.2);
    --danger: #ff5c5c;
    --success: #4ade80;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255,215,0,0.06), transparent 60%),
      var(--bg);
    font-family: 'Outfit', sans-serif;
    color: var(--text);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 16px 80px;
  }

  .page {
    width: 100%;
    max-width: 460px;
  }

  .ticket {
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .ticket-top {
    padding: 28px 28px 20px;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px var(--gold);
  }

  h1 {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }

  .subtitle {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }

  .summary {
    margin-top: 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .summary-label {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .summary-package {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .summary-amount {
    font-size: 24px;
    font-weight: 900;
    color: var(--gold);
    white-space: nowrap;
  }

  .perforation {
    position: relative;
    height: 0;
    border-top: 2px dashed rgba(255,255,255,0.15);
    margin: 24px 0 0;
  }
  .perforation::before,
  .perforation::after {
    content: "";
    position: absolute;
    top: -12px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bg);
  }
  .perforation::before { left: -12px; }
  .perforation::after { right: -12px; }

  .methods {
    padding: 26px 28px 28px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .sp-one-type-select {
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
    background: rgba(255,255,255,0.02);
    transition: border-color .2s ease, background .2s ease;
  }

  .sp-one-type-select:has(input:checked) {
    border-color: rgba(255,215,0,0.4);
    background: rgba(255,215,0,0.04);
  }

  .sp-one-type-select > label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
  }

  .sp-one-type-select input[type="radio"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    min-width: 18px;
    border-radius: 50%;
    border: 2px solid var(--muted-2);
    margin: 0;
    position: relative;
    cursor: pointer;
    transition: border-color .2s ease;
  }

  .sp-one-type-select input[type="radio"]:checked {
    border-color: var(--gold);
  }

  .sp-one-type-select input[type="radio"]:checked::after {
    content: "";
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--gold);
  }

  .sp-one-type-select > div[id] {
    padding: 0 18px 16px;
  }

  .sp-one-type-select > div[id]:empty {
    padding: 0;
  }

  .pay-btn {
    width: 100%;
    padding: 17px;
    margin-top: 8px;
    border: none;
    border-radius: 12px;
    background: var(--gold);
    color: #000;
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background .2s ease, transform .1s ease;
  }

  .pay-btn:hover { background: var(--gold-dim); }
  .pay-btn:active { transform: scale(0.98); }
  .pay-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  #payment-status {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    margin: 14px 0 0;
    min-height: 16px;
  }

  .footnote {
    text-align: center;
    font-size: 10px;
    color: var(--muted-2);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 18px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="ticket">
    <div class="ticket-top">
      <div class="eyebrow">Secure Checkout</div>
      <h1>Payment</h1>
      <div class="subtitle">Choose a payment method to complete your ticket</div>

      <div class="summary">
        <div>
          <div class="summary-label">Order</div>
          <div class="summary-package" id="summary-package">—</div>
        </div>
        <div class="summary-amount" id="summary-amount">$35</div>
      </div>
    </div>

    <div class="perforation"></div>

    <div class="methods">
      <div class="section-label">Payment Method</div>

      <!-- ================================================================
        Payment form — do not rename any id/name here, required by the
        SpaceRemit widget script.
      ================================================================ -->
      <form id="spaceremit-form">
        <input type="hidden" name="amount" id="sp-amount" value="35">
        <input type="hidden" name="currency" value="USD">
        <input type="hidden" name="fullname" id="sp-fullname" value="">
        <input type="hidden" name="email" id="sp-email" value="">
        <input type="hidden" name="phone" id="sp-phone" value="">
        <input type="hidden" name="notes" id="sp-notes" value="">

        <div class="sp-one-type-select">
          <input type="radio" name="sp-pay-type-radio" value="local-methods-pay" id="sp_local_methods_radio" checked>
          <label for="sp_local_methods_radio">Local payment methods</label>
          <div id="spaceremit-local-methods-pay"></div>
        </div>

        <div class="sp-one-type-select">
          <input type="radio" name="sp-pay-type-radio" value="card-pay" id="sp_card_radio">
          <label for="sp_card_radio">Card payment</label>
          <div id="spaceremit-card-pay"></div>
        </div>

        <button type="submit" class="pay-btn" id="pay-btn">Pay now</button>
      </form>

      <p id="payment-status"></p>
    </div>
  </div>

  <div class="footnote">Encrypted &amp; secure checkout via SpaceRemit</div>
</div>

<!-- ================================================================
  SpaceRemit client-side configuration.
  Replace YOUR_PUBLIC_KEY with your real (or test) public key.
================================================================ -->
<script>
  const SP_PUBLIC_KEY = "pkIA3WWCHZWOV3VAU8J324IMM5W4JL6T5MYD8VJJCEOOEE2DN7SF"; // Your website's public key from Websites And Keys
  const SP_FORM_ID = "#spaceremit-form";
  const SP_SELECT_RADIO_NAME = "sp-pay-type-radio";

  const LOCAL_METHODS_BOX_STATUS = true;
  const LOCAL_METHODS_PARENT_ID = "#spaceremit-local-methods-pay";

  const CARD_BOX_STATUS = true;
  const CARD_BOX_PARENT_ID = "#spaceremit-card-pay";

  let SP_FORM_AUTO_SUBMIT_WHEN_GET_CODE = false; // we control submission manually to verify server-side first

  function SP_SUCCESSFUL_PAYMENT(spaceremit_code) {
    verifyPaymentOnServer(spaceremit_code);
  }

  function SP_FAILD_PAYMENT() {
    showStatus("Payment failed. Please try again.", true);
    setButtonLoading(false);
  }

  function SP_RECIVED_MESSAGE(message) {
    console.log("SpaceRemit message:", message);
  }

  function SP_NEED_AUTH(target_auth_link) {
    window.location.href = target_auth_link;
  }

  function showStatus(msg, isError) {
    const el = document.getElementById("payment-status");
    el.textContent = msg;
    el.style.color = isError ? "var(--danger)" : "var(--success)";
  }

  function setButtonLoading(isLoading) {
    const btn = document.getElementById("pay-btn");
    btn.disabled = isLoading;
    btn.textContent = isLoading ? "Processing..." : "Pay now";
  }

  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "spaceremit-form") {
      setButtonLoading(true);
    }
  });

  // Send the code to our server for real verification before delivering anything
  async function verifyPaymentOnServer(spaceremit_code) {
    showStatus("Verifying your payment...", false);
    try {
      const res = await fetch("/.netlify/functions/verify-payment", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          payment_id: spaceremit_code,
          orderId: window.CURRENT_ORDER_ID || "",
        }),
      });
      const data = await res.json();
      if (res.ok && data.verified) {
        showStatus("Payment confirmed, redirecting...", false);
        window.location.href = `/payment/success?order=${encodeURIComponent(window.CURRENT_ORDER_ID || "")}`;
      } else {
        showStatus(data.error || "Could not verify this payment.", true);
        setButtonLoading(false);
      }
    } catch (err) {
      showStatus("Could not reach the server.", true);
      setButtonLoading(false);
    }
  }
</script>

<script src="https://spaceremit.com/api/v2/js_script/spaceremit.js"></script>

<script>
  // Fill order data from the query string before rendering the form
  (function fillOrderData() {
    const params = new URLSearchParams(window.location.search);

    window.CURRENT_ORDER = {
      orderId: params.get("order") || "",
      amount: params.get("amount") || "35",
      name: params.get("name") || "",
      email: params.get("email") || "",
      phone: params.get("phone") || "",
      packageName: params.get("package") || "",
      packageId: params.get("packageId") || "",
      productType: params.get("productType") || "tickets",
    };

    window.CURRENT_ORDER_ID = window.CURRENT_ORDER.orderId;

    document.getElementById("sp-amount").value = window.CURRENT_ORDER.amount;
    document.getElementById("sp-fullname").value = window.CURRENT_ORDER.name;
    document.getElementById("sp-email").value = window.CURRENT_ORDER.email;
    document.getElementById("sp-phone").value = window.CURRENT_ORDER.phone;
    document.getElementById("sp-notes").value = window.CURRENT_ORDER.packageName;

    document.getElementById("summary-package").textContent = window.CURRENT_ORDER.packageName || "Your order";
    document.getElementById("summary-amount").textContent = "$" + window.CURRENT_ORDER.amount;
  })();
</script>

</body>
</html>
